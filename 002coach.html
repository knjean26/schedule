<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>002 Academy – ตารางสอน</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async></script>
<style>
:root {
  --green: #4ade80;
  --lime: #a3e635;
  --dark: #080d08;
  --panel: #0f160f;
  --card: #141f14;
  --border: #243024;
  --text: #e2f0e2;
  --muted: #6b8f6b;
  --accent: #ff6b35;
  --red: #f87171;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--dark); color:var(--text); font-family:'Sarabun',sans-serif; min-height:100vh; }

body::before {
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image: linear-gradient(rgba(74,222,128,.025) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(74,222,128,.025) 1px, transparent 1px);
  background-size: 56px 56px;
}

/* LOGIN */
#loginScreen {
  position:fixed; inset:0; z-index:200;
  display:flex; align-items:center; justify-content:center;
  background: radial-gradient(ellipse at 50% 40%, rgba(74,222,128,.08) 0%, var(--dark) 70%);
}
.login-box {
  background:var(--panel); border:1px solid var(--border);
  border-radius:20px; padding:40px 36px; width:90%; max-width:380px;
  text-align:center; box-shadow:0 0 60px rgba(74,222,128,.1);
  animation:popIn .4s cubic-bezier(.34,1.56,.64,1);
}
@keyframes popIn { from{opacity:0;transform:scale(.88)} to{opacity:1;transform:scale(1)} }
.login-icon { font-size:3rem; margin-bottom:12px; filter:drop-shadow(0 0 16px rgba(74,222,128,.6)); }
.login-title { font-family:'Bebas Neue',sans-serif; font-size:2rem; letter-spacing:3px; color:var(--green); }
.login-sub { font-size:.8rem; color:var(--muted); margin-bottom:28px; letter-spacing:1px; }
.login-box input {
  width:100%; background:var(--card); border:1px solid var(--border);
  color:var(--text); border-radius:10px; padding:12px 16px;
  font-size:1rem; font-family:'Sarabun',sans-serif; margin-bottom:12px; transition:border-color .2s;
}
.login-box input:focus { outline:none; border-color:var(--green); }
.login-error { color:var(--red); font-size:.8rem; margin-bottom:10px; min-height:18px; }
.btn-login {
  width:100%; padding:13px;
  background:linear-gradient(135deg,var(--green),var(--lime));
  color:var(--dark); border:none; border-radius:10px;
  font-size:1rem; font-weight:700; cursor:pointer; font-family:'Sarabun',sans-serif;
  letter-spacing:1px; transition:opacity .2s,transform .1s;
}
.btn-login:hover { opacity:.9; }
.btn-login:active { transform:scale(.97); }
.public-link { margin-top:18px; font-size:.8rem; color:var(--muted); }
.public-link a { color:var(--green); cursor:pointer; text-decoration:none; font-weight:600; }
.public-link a:hover { text-decoration:underline; }

/* APP */
#app { position:relative; z-index:1; max-width:1100px; margin:0 auto; padding:24px 16px; display:none; }
header {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:28px; padding-bottom:18px; border-bottom:1px solid var(--border);
  flex-wrap:wrap; gap:12px;
}
.logo { display:flex; align-items:center; gap:14px; }
.paddle-icon {
  width:50px; height:50px; background:linear-gradient(135deg,var(--green),var(--lime));
  border-radius:12px 12px 20px 12px; display:flex; align-items:center; justify-content:center;
  font-size:24px; box-shadow:0 0 24px rgba(74,222,128,.4); animation:glow 3s ease-in-out infinite;
}
@keyframes glow { 0%,100%{box-shadow:0 0 24px rgba(74,222,128,.4)} 50%{box-shadow:0 0 40px rgba(74,222,128,.7)} }
h1 { font-family:'Bebas Neue',sans-serif; font-size:2rem; letter-spacing:3px;
     background:linear-gradient(135deg,var(--green),var(--lime));
     -webkit-background-clip:text; -webkit-text-fill-color:transparent; line-height:1; }
.subtitle { font-size:.75rem; color:var(--muted); letter-spacing:2px; text-transform:uppercase; }
.header-right { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.mode-badge { display:flex; align-items:center; gap:6px; padding:6px 14px; border-radius:20px; font-size:.75rem; font-weight:700; letter-spacing:1px; text-transform:uppercase; }
.mode-admin { background:rgba(74,222,128,.15); border:1px solid rgba(74,222,128,.4); color:var(--green); }
.mode-public { background:rgba(163,230,53,.1); border:1px solid rgba(163,230,53,.3); color:var(--lime); }
.coach-filter-wrap { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:4px 8px; }
.coach-filter-wrap select { background:transparent; border:none; color:var(--text); font-family:'Sarabun',sans-serif; font-size:.85rem; font-weight:600; cursor:pointer; outline:none; padding:4px 4px; }
.coach-filter-wrap select option { background:var(--card); }
.week-nav { display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:8px 12px; }
.week-btn { background:none; border:1px solid var(--border); color:var(--green); border-radius:7px; width:30px; height:30px; cursor:pointer; font-size:14px; transition:all .2s; display:flex; align-items:center; justify-content:center; }
.week-btn:hover { background:var(--green); color:var(--dark); border-color:var(--green); }
.week-label { font-size:.85rem; font-weight:600; min-width:170px; text-align:center; }
.btn-logout { background:none; border:1px solid var(--border); color:var(--muted); border-radius:8px; padding:7px 14px; cursor:pointer; font-size:.8rem; font-family:'Sarabun',sans-serif; transition:all .2s; }
.btn-logout:hover { border-color:var(--red); color:var(--red); }

/* Stats */
.stats-bar { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:24px; }
.stat-card { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:14px; text-align:center; transition:border-color .2s; }
.stat-card:hover { border-color:var(--green); }
.stat-num { font-family:'Bebas Neue',sans-serif; font-size:1.9rem; color:var(--green); line-height:1; }
.stat-label { font-size:.72rem; color:var(--muted); margin-top:3px; }

/* Main */
.main-grid { display:grid; grid-template-columns:1fr 320px; gap:18px; }
.admin-only { display:none; }
body.admin-mode .admin-only { display:flex; flex-direction:column; gap:16px; }

/* Day cards */
.calendar-section { display:flex; flex-direction:column; gap:14px; }
.day-card { background:var(--panel); border:1px solid var(--border); border-radius:14px; overflow:hidden; transition:border-color .2s; }
.day-card.has-sessions { border-color:rgba(74,222,128,.25); }
.day-card:hover { border-color:rgba(74,222,128,.5); }
.day-header { display:flex; align-items:center; justify-content:space-between; padding:12px 18px; background:var(--card); }
.day-name { font-weight:700; font-size:.9rem; }
.day-date { font-size:.75rem; color:var(--muted); }
.day-badge { background:linear-gradient(135deg,var(--green),var(--lime)); color:var(--dark); font-size:.65rem; font-weight:700; padding:2px 10px; border-radius:20px; }

.session-item { display:grid; grid-template-columns:90px 1fr auto; align-items:center; gap:10px; padding:11px 18px; border-top:1px solid var(--border); transition:background .15s; animation:fadeIn .3s ease; }
@keyframes fadeIn { from{opacity:0;transform:translateY(-5px)} to{opacity:1;transform:translateY(0)} }
.session-item:hover { background:rgba(74,222,128,.04); }
.session-time { display:flex; flex-direction:column; gap:1px; }
.session-time-start { font-family:'Bebas Neue',sans-serif; font-size:1.05rem; color:var(--green); letter-spacing:1px; line-height:1; }
.session-time-end { font-size:.68rem; color:var(--muted); letter-spacing:.5px; }
.session-title { font-size:.875rem; font-weight:600; }
.session-meta { font-size:.72rem; color:var(--muted); margin-top:2px; }
.level-badge { font-size:.62rem; font-weight:700; padding:2px 8px; border-radius:6px; text-transform:uppercase; letter-spacing:1px; white-space:nowrap; }
.level-beginner { background:rgba(74,222,128,.15); color:var(--green); border:1px solid rgba(74,222,128,.3); }
.level-intermediate { background:rgba(255,165,0,.15); color:#ffa500; border:1px solid rgba(255,165,0,.3); }
.level-advanced { background:rgba(255,107,53,.15); color:var(--accent); border:1px solid rgba(255,107,53,.3); }
.session-actions { display:flex; gap:5px; margin-top:5px; }
.btn-sm { background:none; border:1px solid var(--border); color:var(--muted); border-radius:6px; padding:3px 7px; cursor:pointer; font-size:.72rem; font-family:'Sarabun',sans-serif; transition:all .15s; }
.btn-sm:hover { border-color:var(--green); color:var(--green); }
.btn-sm.danger:hover { border-color:var(--red); color:var(--red); }
.empty-day { padding:14px 18px; color:var(--muted); font-size:.82rem; text-align:center; border-top:1px solid var(--border); }

/* End-time hint */
.end-time-hint { font-size:.72rem; color:var(--green); padding:4px 0 2px; }
.dup-tag { display:inline-flex; align-items:center; background:rgba(74,222,128,.15); border:1px solid rgba(74,222,128,.3); color:var(--green); border-radius:6px; padding:3px 8px; font-size:.75rem; font-weight:600; }

/* Panel / Form */
.panel { background:var(--panel); border:1px solid var(--border); border-radius:14px; overflow:hidden; }
.panel-header { padding:12px 18px; background:var(--card); border-bottom:1px solid var(--border); font-weight:700; font-size:.8rem; letter-spacing:1px; text-transform:uppercase; color:var(--green); }
.panel-body { padding:14px; }
.form-group { margin-bottom:10px; }
.form-label { font-size:.7rem; color:var(--muted); margin-bottom:5px; display:block; letter-spacing:1px; text-transform:uppercase; }
.form-control { width:100%; background:var(--card); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:8px 11px; font-size:.85rem; font-family:'Sarabun',sans-serif; transition:border-color .2s; appearance:none; }
.form-control:focus { outline:none; border-color:var(--green); }
.form-control option { background:var(--card); }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.form-row-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
.btn-primary { width:100%; padding:11px; background:linear-gradient(135deg,var(--green),var(--lime)); color:var(--dark); border:none; border-radius:8px; font-size:.875rem; font-weight:700; cursor:pointer; font-family:'Sarabun',sans-serif; letter-spacing:1px; transition:opacity .2s,transform .1s; }
.btn-primary:hover { opacity:.9; }
.btn-primary:active { transform:scale(.98); }

/* Coach list */
.coach-item { display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); }
.coach-item:last-child { border-bottom:none; }
.coach-avatar { width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1rem; flex-shrink:0; background:rgba(74,222,128,.1); }
.coach-name { font-size:.85rem; font-weight:600; }
.coach-specialty { font-size:.72rem; color:var(--muted); }
.coach-sessions { margin-left:auto; font-family:'Bebas Neue',sans-serif; font-size:1.1rem; color:var(--green); }

/* Modal */
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.75); backdrop-filter:blur(5px); z-index:300; align-items:center; justify-content:center; }
.modal-overlay.show { display:flex; }
.modal { background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:24px; width:90%; max-width:420px; animation:popIn .25s ease; max-height:90vh; overflow-y:auto; }
.modal-title { font-family:'Bebas Neue',sans-serif; font-size:1.4rem; color:var(--green); letter-spacing:2px; margin-bottom:18px; }
.modal-actions { display:flex; gap:10px; margin-top:18px; }
.btn-cancel { flex:1; padding:10px; background:none; border:1px solid var(--border); color:var(--muted); border-radius:8px; cursor:pointer; font-family:'Sarabun',sans-serif; transition:all .15s; }
.btn-cancel:hover { border-color:var(--text); color:var(--text); }

/* Toast */
.toast { position:fixed; bottom:24px; right:24px; z-index:400; background:var(--green); color:var(--dark); padding:12px 20px; border-radius:10px; font-weight:700; font-size:.85rem; box-shadow:0 8px 30px rgba(74,222,128,.4); display:none; }
.toast.show { display:block; animation:toastIn .3s ease; }
@keyframes toastIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }

@media(max-width:768px){
  .main-grid { grid-template-columns:1fr; }
  .stats-bar { grid-template-columns:repeat(2,1fr); }
  h1 { font-size:1.5rem; }
  .header-right { width:100%; }
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box" id="loginBox">
    <div class="login-icon">🏓</div>
    <div class="login-title">002 ACADEMY</div>
    <div class="login-sub">ระบบตารางสอน</div>
    <input type="password" id="pwInput" placeholder="รหัสผ่านแอดมิน" onkeydown="if(event.key==='Enter')doLogin()">
    <div class="login-error" id="loginErr"></div>
    <button class="btn-login" onclick="doLogin()">🔐 เข้าสู่ระบบแอดมิน</button>
    <div class="public-link">หรือ <a onclick="enterPublic()">👁 ดูตารางแบบสาธารณะ (ไม่ต้องล็อกอิน)</a></div>
  </div>

  <div class="login-box" id="syncBox" style="display:none">
    <div class="login-icon" id="syncIcon">🔗</div>
    <div class="login-title">002 ACADEMY</div>
    <div class="login-sub" id="syncMsg">กรุณาเชื่อมต่อ Google เพื่อโหลดข้อมูล</div>
    <button class="btn-login" id="syncBtn" onclick="connectGoogle()" style="display:none">🔗 เชื่อมต่อ Google Sheets</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div class="logo">
      <div class="paddle-icon">🏓</div>
      <div><h1>002 ACADEMY</h1><div class="subtitle">ตารางสอน</div></div>
    </div>
    <div class="header-right">
      <div class="mode-badge" id="modeBadge"></div>
      <div class="coach-filter-wrap">
        <select id="coachFilter" onchange="applyCoachFilter()">
          <option value="">👤 โค้ชทั้งหมด</option>
          <option>เอก</option><option>เอิ้น</option><option>แทน</option><option>พีท</option>
          <option>แม๊ก</option><option>นิว</option><option>เฟรม</option><option>ภูมิ</option>
          <option>โอ๊ต</option><option>เอ๋ย</option><option>โฟล์ค</option>
        </select>
      </div>
      <div class="coach-filter-wrap">
        <select id="venueFilter" onchange="applyVenueFilter()">
          <option value="">📍 ทุกสถานที่</option>
        </select>
      </div>
      <div class="week-nav">
        <button class="week-btn" onclick="changeWeek(-1)">‹</button>
        <div class="week-label" id="weekLabel">—</div>
        <button class="week-btn" onclick="changeWeek(1)">›</button>
      </div>
      <button class="btn-logout" id="logoutBtn" onclick="doLogout()">ออกจากระบบ</button>
    </div>
  </header>

  <div class="stats-bar">
    <div class="stat-card"><div class="stat-num" id="statTotal">0</div><div class="stat-label">คลาสทั้งหมด</div></div>
    <div class="stat-card"><div class="stat-num" id="statStudents">0</div><div class="stat-label">นักเรียนรวม</div></div>
    <div class="stat-card"><div class="stat-num" id="statHours">0</div><div class="stat-label">ชั่วโมงสอน</div></div>
    <div class="stat-card"><div class="stat-num">11</div><div class="stat-label">โค้ช</div></div>
  </div>

  <div class="main-grid">
    <div class="calendar-section" id="calendarSection"></div>
    <div class="admin-only" id="adminSidebar">
      <div class="panel">
        <div class="panel-header">➕ เพิ่มคลาสใหม่</div>
        <div class="panel-body">
          <div class="form-group">
            <label class="form-label">ชื่อคลาส</label>
            <input class="form-control" id="fTitle" type="text" placeholder="เช่น เซิร์ฟและรับ">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">วันที่</label>
              <input class="form-control" id="fDate" type="date">
            </div>
            <div class="form-group">
              <label class="form-label">เวลาเริ่ม</label>
              <input class="form-control" id="fTime" type="time" value="09:00" oninput="updateEndTime('f')">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">ระยะเวลา</label>
              <select class="form-control" id="fDuration" onchange="updateEndTime('f')">
                <option value="60" selected>1 ชั่วโมง</option>
                <option value="120">2 ชั่วโมง</option>
                <option value="180">3 ชั่วโมง</option>
                <option value="240">4 ชั่วโมง</option>
                <option value="300">5 ชั่วโมง</option>
                <option value="360">6 ชั่วโมง</option>
              </select>
            </div>
            <div class="form-group" style="display:flex;align-items:flex-end">
              <div class="end-time-hint" id="fEndTime">สิ้นสุด 10:00</div>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">ระดับ</label>
              <select class="form-control" id="fLevel">
                <option value="beginner">มือใหม่</option>
                <option value="intermediate">กลาง</option>
                <option value="advanced">สูง</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">นักเรียน</label>
              <input class="form-control" id="fStudents" type="number" value="4" min="1" max="30">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">โค้ช</label>
            <select class="form-control" id="fCoach">
              <option>เอก</option><option>เอิ้น</option><option>แทน</option><option>พีท</option>
              <option>แม๊ก</option><option>นิว</option><option>เฟรม</option><option>ภูมิ</option>
              <option>โอ๊ต</option><option>เอ๋ย</option><option>โฟล์ค</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">สถานที่</label>
            <select class="form-control" id="fVenue" onchange="toggleVenueOther('f')">
              <option value="Beat Discovery">Beat Discovery</option>
              <option value="The Racquet Realm">The Racquet Realm</option>
              <option value="Club 46">Club 46</option>
              <option value="Other">อื่นๆ (ระบุเอง)</option>
            </select>
          </div>
          <div class="form-group" id="fVenueOtherWrap" style="display:none">
            <label class="form-label">ระบุสถานที่</label>
            <input class="form-control" id="fVenueOther" type="text" placeholder="กรอกชื่อสถานที่">
          </div>
          <div class="form-group">
            <label class="form-label">คอร์ท</label>
            <input class="form-control" id="fCourt" type="number" value="1" min="1" max="99">
          </div>
          <button class="btn-primary" onclick="addSession()">+ เพิ่มคลาส</button>
        </div>
      </div>
      <div class="panel">
        <div class="panel-header">👤 โค้ชประจำ</div>
        <div class="panel-body" id="coachList"></div>
      </div>
      <div class="panel">
        <div class="panel-header">⚙️ ตั้งค่า</div>
        <div class="panel-body">
          <button class="btn-primary" style="background:linear-gradient(135deg,#f87171,#fb923c)" onclick="clearAllData()">🗑️ ล้างข้อมูลทั้งหมด</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <div class="modal-title">✏️ แก้ไขคลาส</div>
    <div class="form-group">
      <label class="form-label">ชื่อคลาส</label>
      <input class="form-control" id="mTitle">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">วันที่</label>
        <input class="form-control" id="mDate" type="date">
      </div>
      <div class="form-group">
        <label class="form-label">เวลาเริ่ม</label>
        <input class="form-control" id="mTime" type="time" oninput="updateEndTime('m')">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">ระยะเวลา</label>
        <select class="form-control" id="mDuration" onchange="updateEndTime('m')">
          <option value="60" selected>1 ชั่วโมง</option>
          <option value="120">2 ชั่วโมง</option>
          <option value="180">3 ชั่วโมง</option>
          <option value="240">4 ชั่วโมง</option>
          <option value="300">5 ชั่วโมง</option>
          <option value="360">6 ชั่วโมง</option>
        </select>
      </div>
      <div class="form-group" style="display:flex;align-items:flex-end">
        <div class="end-time-hint" id="mEndTime">สิ้นสุด 10:00</div>
      </div>
    </div>
    <div class="form-row">

      <label class="form-label">คอร์ท</label>
      <input class="form-control" id="mCourt" type="number" min="1" max="99">

      <button class="btn-cancel" onclick="closeModal('editModal')">ยกเลิก</button>
      <button class="btn-primary" style="flex:1" onclick="saveEdit()">บันทึก</button>

</div>


<!-- Duplicate Modal -->
<div class="modal-overlay" id="dupModal">
  <div class="modal">
    <div class="modal-title">📋 ทำสำเนาคลาส</div>
    <div style="font-size:.85rem;color:var(--muted);margin-bottom:14px" id="dupTitle"></div>

      <label class="form-label">เลือกวันที่ <span id="dupCount" style="color:var(--green)">0/4</span></label>

        <input class="form-control" id="dupDateInput" type="date" style="flex:1">

      <button class="btn-primary" style="flex:1" onclick="confirmDuplicate()">✅ ทำสำเนา</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const KEY_S='pb_sessions', KEY_CV='pb_custom_venues';
const FIXED_PW_HASH='ac9689e2272427085e35b9d3e3e8bed88cb3434828b43b86fc0596cad4c6e270';
const SHEET_ID='1fCLRpZfE6eaiuAa404GA5WUYXmihVcbVKsjUIIZgSE8';
const CLIENT_ID='886397941210-1iemf0bqi86nl9lpelkae9d4a8c52aoq.apps.googleusercontent.com';
const DAY_NAMES=['จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์','อาทิตย์'];
const KNOWN_VENUES=['Beat Discovery','The Racquet Realm','Club 46'];
const COACHES=[
  {name:'เอก',emoji:'🟢'},{name:'เอิ้น',emoji:'🔵'},{name:'แทน',emoji:'🟡'},
  {name:'พีท',emoji:'🟠'},{name:'แม๊ก',emoji:'🔴'},{name:'นิว',emoji:'🟣'},
  {name:'เฟรม',emoji:'🟤'},{name:'ภูมิ',emoji:'⚪'},{name:'โอ๊ต',emoji:'🟢'},
  {name:'เอ๋ย',emoji:'🔵'},{name:'โฟล์ค',emoji:'🟡'},
];

const toDateStr=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

function getWeekStart(off=0){
  const now=new Date(),day=now.getDay();
  const mon=new Date(now);
  mon.setDate(now.getDate()-(day===0?6:day-1)+off*7);
  mon.setHours(0,0,0,0); return mon;
}

function calcEndTime(startTime,durationMins){
  const[h,m]=startTime.split(':').map(Number);
  const tot=h*60+m+parseInt(durationMins||60);
  return `${String(Math.floor(tot/60)%24).padStart(2,'0')}:${String(tot%60).padStart(2,'0')}`;
}
function updateEndTime(p){
  const t=document.getElementById(p+'Time').value;
  const d=document.getElementById(p+'Duration').value;
  if(t) document.getElementById(p+'EndTime').textContent=`สิ้นสุด ${calcEndTime(t,d)}`;
}
function toggleVenueOther(p){
  const isOther=document.getElementById(p+'Venue').value==='Other';
  document.getElementById(p+'VenueOtherWrap').style.display=isOther?'block':'none';
}
const getVenueName=s=>s.venue==='Other'?(s.venueOther||''):(s.venue||'');
function getCustomVenues(){try{return JSON.parse(localStorage.getItem(KEY_CV))||[];}catch{return[];}}
function saveCustomVenue(name){
  if(!name||KNOWN_VENUES.includes(name))return;
  const cv=getCustomVenues();
  if(!cv.includes(name)){cv.push(name);localStorage.setItem(KEY_CV,JSON.stringify(cv));}
}
function buildVenueSelect(id,current){
  const sel=document.getElementById(id); if(!sel)return;
  const opts=[...KNOWN_VENUES,...getCustomVenues()];
  sel.innerHTML=opts.map(v=>`<option value="${v}"${v===current?' selected':''}>${v}</option>`).join('')
    +`<option value="Other"${current==='Other'?' selected':''}>อื่นๆ (ระบุเอง)</option>`;
}

/* DEF_SESSIONS with real dates */
const _ws0=getWeekStart(0);
const _d=idx=>{const d=new Date(_ws0);d.setDate(_ws0.getDate()+idx);return toDateStr(d);};
const DEF_SESSIONS=[
  {id:1,date:_d(0),time:'08:00',duration:60,title:'พิคเคิลบอลเบื้องต้น',level:'beginner',students:6,coach:'เอก',venue:'Beat Discovery',venueOther:'',court:1},
  {id:2,date:_d(0),time:'10:00',duration:60,title:'เทคนิคการดริป',level:'intermediate',students:4,coach:'เอิ้น',venue:'Beat Discovery',venueOther:'',court:2},
  {id:3,date:_d(1),time:'09:00',duration:120,title:'คลาสสแมช',level:'advanced',students:3,coach:'เอิ้น',venue:'The Racquet Realm',venueOther:'',court:1},
  {id:4,date:_d(2),time:'08:30',duration:60,title:'ฝึกเซิร์ฟ',level:'beginner',students:8,coach:'เอก',venue:'Club 46',venueOther:'',court:1},
  {id:5,date:_d(3),time:'17:00',duration:60,title:'ดับเบิ้ลกลยุทธ์',level:'intermediate',students:4,coach:'แทน',venue:'The Racquet Realm',venueOther:'',court:3},
  {id:6,date:_d(5),time:'07:00',duration:120,title:'เวิร์กช็อปเช้าวันเสาร์',level:'beginner',students:10,coach:'เอก',venue:'Beat Discovery',venueOther:'',court:1},
  {id:7,date:_d(6),time:'09:00',duration:120,title:'คลาสพิเศษ',level:'advanced',students:4,coach:'แทน',venue:'Club 46',venueOther:'',court:2},
];

let isAdmin=false, weekOffset=0, editingId=null, selectedCoach='', selectedVenue='';
let duplicatingId=null, duplicateDates=[];
let gToken=null, gTokenExpiry=0;

/* Load + migrate old sessions */
let sessions=(()=>{
  try{
    let s=JSON.parse(localStorage.getItem(KEY_S));
    if(!s) return [];
    const ws=getWeekStart(0);
    return s.map(sess=>{
      /* dayIdx → date migration */
      if(!sess.date && sess.dayIdx!==undefined){
        const d=new Date(ws); d.setDate(ws.getDate()+sess.dayIdx);
        sess={...sess,date:toDateStr(d)};
        delete sess.dayIdx;
      }
      /* court → venue/court migration */
      if(!sess.venue && sess.court){
        const v=KNOWN_VENUES.includes(sess.court)?sess.court:'Other';
        sess={...sess,venue:v,venueOther:v==='Other'?sess.court:'',court:1};
      }
      if(!sess.duration) sess={...sess,duration:60};
      if(!sess.venueOther) sess={...sess,venueOther:''};
      return sess;
    });
  }catch{return [];}
})();
let nextId=Math.max(...sessions.map(s=>s.id),0)+1;

const saveSessions=()=>{
  localStorage.setItem(KEY_S,JSON.stringify(sessions));
  autoSync();
};
async function hashPw(str){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function enterAdmin(){
  isAdmin=true;
  document.body.classList.add('admin-mode');
  document.getElementById('loginBox').style.display='none';
  document.getElementById('syncBox').style.display='';
  document.getElementById('syncIcon').textContent='🔗';
  document.getElementById('syncMsg').textContent='กรุณาเชื่อมต่อ Google เพื่อโหลดข้อมูล';
  document.getElementById('syncBtn').style.display='';
  document.getElementById('syncBtn').textContent='🔗 เชื่อมต่อ Google Sheets';
}

let _gClient=null;
function connectGoogle(){
  if(gToken&&Date.now()<gTokenExpiry-60000){afterGoogleAuth();return;}
  if(!_gClient) _gClient=google.accounts.oauth2.initTokenClient({
    client_id:CLIENT_ID,
    scope:'https://www.googleapis.com/auth/spreadsheets',
    callback:r=>{
      if(r.error){showSyncError(r.error_description||r.error);return;}
      gToken=r.access_token;
      gTokenExpiry=Date.now()+(r.expires_in||3600)*1000;
      afterGoogleAuth();
    },
  });
  document.getElementById('syncBtn').style.display='none';
  document.getElementById('syncMsg').textContent='กำลังเชื่อมต่อ Google...';
  document.getElementById('syncIcon').textContent='⏳';
  _gClient.requestAccessToken({prompt:''});
}

async function afterGoogleAuth(){
  document.getElementById('syncBtn').style.display='none';
  document.getElementById('syncMsg').textContent='กำลัง sync ข้อมูลจาก Google Sheets...';
  document.getElementById('syncIcon').textContent='⏳';
  try{
    await doPullFromSheets(gToken);
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('app').style.display='block';
    document.getElementById('modeBadge').className='mode-badge mode-admin';
    document.getElementById('modeBadge').textContent='🔐 แอดมิน';
    render();
  }catch(e){
    showSyncError('ไม่สามารถโหลดข้อมูลจาก Sheets ได้ กรุณาลองใหม่');
  }
}

function showSyncError(msg){
  document.getElementById('syncIcon').textContent='❌';
  document.getElementById('syncMsg').textContent=msg||'ไม่สามารถ sync ได้';
  document.getElementById('syncBtn').style.display='';
  document.getElementById('syncBtn').textContent='🔄 ลองใหม่';
}

async function doLogin(){
  const hash=await hashPw(document.getElementById('pwInput').value);
  if(hash===FIXED_PW_HASH){
    enterAdmin();
  }else{
    document.getElementById('loginErr').textContent='รหัสผ่านไม่ถูกต้อง';
    document.getElementById('pwInput').value='';
    setTimeout(()=>document.getElementById('loginErr').textContent='',2500);
  }
}


function enterPublic(){
  isAdmin=false;
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').style.display='block';
  document.body.classList.remove('admin-mode');
  document.getElementById('modeBadge').className='mode-badge mode-public';
  document.getElementById('modeBadge').textContent='👁 ดูตาราง';
  document.getElementById('logoutBtn').textContent='← กลับ';
  render();
}

function doLogout(){
  isAdmin=false; gToken=null; gTokenExpiry=0; selectedCoach=''; selectedVenue='';
  document.getElementById('app').style.display='none';
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('pwInput').value='';
  document.body.classList.remove('admin-mode');
  document.getElementById('logoutBtn').textContent='ออกจากระบบ';
  document.getElementById('coachFilter').value='';
  document.getElementById('venueFilter').value='';
  weekOffset=0;
}

const fmtDate=d=>`${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
const lvlLabel=l=>({beginner:'มือใหม่',intermediate:'กลาง',advanced:'สูง'}[l]||l);

async function changeWeek(d){
  weekOffset+=d;
  const fDate=document.getElementById('fDate');
  if(fDate) fDate.value=toDateStr(getWeekStart(weekOffset));
  render();
  if(gToken&&Date.now()<gTokenExpiry-60000){
    try{await doSyncToSheets(gToken);if(await doPullFromSheets(gToken))render();}catch(e){}
  }
}
function applyCoachFilter(){
  selectedCoach=document.getElementById('coachFilter').value;
  render();
}
function applyVenueFilter(){
  selectedVenue=document.getElementById('venueFilter').value;
  render();
}
function openDuplicate(id){
  const s=sessions.find(x=>x.id===id); if(!s)return;
  duplicatingId=id; duplicateDates=[];
  document.getElementById('dupTitle').textContent=`"${s.title}"`;
  document.getElementById('dupDateInput').value='';
  renderDupDates();
  document.getElementById('dupModal').classList.add('show');
}
function addDuplicateDate(){
  const val=document.getElementById('dupDateInput').value;
  if(!val){showToast('⚠️ กรุณาเลือกวันที่');return;}
  if(duplicateDates.includes(val)){showToast('⚠️ วันที่นี้มีอยู่แล้ว');return;}
  if(duplicateDates.length>=4){showToast('⚠️ เพิ่มได้สูงสุด 4 วัน');return;}
  duplicateDates.push(val);
  renderDupDates();
  document.getElementById('dupDateInput').value='';
}
function removeDuplicateDate(date){
  duplicateDates=duplicateDates.filter(d=>d!==date);
  renderDupDates();
}
function renderDupDates(){
  document.getElementById('dupDateList').innerHTML=duplicateDates.length===0
    ?'<span style="color:var(--muted);font-size:.8rem">ยังไม่ได้เลือกวันที่</span>'
    :duplicateDates.map(d=>`<span class="dup-tag">${fmtDate(new Date(d+'T00:00:00'))} <span onclick="removeDuplicateDate('${d}')" style="cursor:pointer;margin-left:4px;opacity:.7">×</span></span>`).join('');
  document.getElementById('dupCount').textContent=`${duplicateDates.length}/4`;
}
function confirmDuplicate(){
  if(!duplicateDates.length){showToast('⚠️ กรุณาเลือกอย่างน้อย 1 วัน');return;}
  const s=sessions.find(x=>x.id===duplicatingId); if(!s)return;
  duplicateDates.forEach(date=>sessions.push({...s,id:nextId++,date}));
  saveSessions();
  closeModal('dupModal');
  showToast(`✅ ทำสำเนา ${duplicateDates.length} คลาสแล้ว`);
  render();
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2400);
}

function render(){
  const ws=getWeekStart(weekOffset);
  const wsStr=toDateStr(ws), weStr=toDateStr(new Date(ws.getTime()+6*864e5));
  document.getElementById('weekLabel').textContent=`${fmtDate(ws)} – ${fmtDate(new Date(ws.getTime()+6*864e5))}`;
  document.getElementById('statTotal').textContent=sessions.length;
  document.getElementById('statStudents').textContent=sessions.reduce((a,s)=>a+s.students,0);
  document.getElementById('statHours').textContent=sessions.length;

  const weekSessions=sessions.filter(s=>s.date>=wsStr&&s.date<=weStr);

  /* Rebuild venue filter options from all sessions */
  const venueEl=document.getElementById('venueFilter');
  const prevVenue=venueEl.value;
  const allVenues=[...new Set(sessions.map(s=>getVenueName(s)).filter(Boolean))].sort();
  venueEl.innerHTML='<option value="">📍 ทุกสถานที่</option>'
    +allVenues.map(v=>`<option value="${v}"${v===prevVenue?' selected':''}>${v}</option>`).join('');

  const cal=document.getElementById('calendarSection');
  cal.innerHTML='';
  for(let idx=0;idx<7;idx++){
    const dd=new Date(ws); dd.setDate(ws.getDate()+idx);
    const dateStr=toDateStr(dd);
    let ds=weekSessions.filter(s=>s.date===dateStr);
    if(selectedCoach) ds=ds.filter(s=>s.coach===selectedCoach);
    if(selectedVenue) ds=ds.filter(s=>getVenueName(s)===selectedVenue);
    ds=ds.sort((a,b)=>a.time.localeCompare(b.time));

    const card=document.createElement('div');
    card.className='day-card'+(ds.length?' has-sessions':'');
    card.innerHTML=`
      <div class="day-header">
        <div><div class="day-name">${DAY_NAMES[idx]}</div><div class="day-date">${fmtDate(dd)}</div></div>
        ${ds.length?`<span class="day-badge">${ds.length} คลาส</span>`:''}
      </div>
      <div>
        ${ds.length?ds.map(s=>`
        <div class="session-item">
          <div class="session-time">
            <div class="session-time-start">${s.time}</div>
            <div class="session-time-end">–${calcEndTime(s.time,s.duration||60)}</div>
          </div>
          <div>
            <div class="session-title">${s.title}</div>
            <div class="session-meta">👤 ${s.coach} &nbsp;·&nbsp; 📍 ${getVenueName(s)} · Court ${s.court||1} &nbsp;·&nbsp; 👥 ${s.students} คน</div>
          </div>
          <div style="text-align:right">
            <span class="level-badge level-${s.level}">${lvlLabel(s.level)}</span>
            ${isAdmin?`<div class="session-actions">
              <button class="btn-sm" onclick="openEdit(${s.id})">✏️</button>
              <button class="btn-sm" onclick="openDuplicate(${s.id})">📋</button>
              <button class="btn-sm danger" onclick="delSession(${s.id})">🗑️</button>
            </div>`:''}
          </div>
        </div>`).join(''):'<div class="empty-day">— ไม่มีคลาสในวันนี้ —</div>'}
      </div>`;
    cal.appendChild(card);
  }

  if(isAdmin){
    const fDate=document.getElementById('fDate');
    if(!fDate.value) fDate.value=toDateStr(new Date());
    updateEndTime('f');
    buildVenueSelect('fVenue',document.getElementById('fVenue').value||'Beat Discovery');

    document.getElementById('coachList').innerHTML=COACHES.map(c=>`
      <div class="coach-item">
        <div class="coach-avatar">${c.emoji}</div>
        <div><div class="coach-name">${c.name}</div><div class="coach-specialty">โค้ช</div></div>
        <div class="coach-sessions">${sessions.filter(s=>s.coach===c.name).length}</div>
      </div>`).join('');
  }
}

function addSession(){
  const date=document.getElementById('fDate').value;
  const title=document.getElementById('fTitle').value.trim();
  const venue=document.getElementById('fVenue').value;
  const venueOther=venue==='Other'?document.getElementById('fVenueOther').value.trim():'';
  if(!date){showToast('⚠️ กรุณาเลือกวันที่ก่อน');return;}
  if(!title){showToast('⚠️ กรุณาใส่ชื่อคลาส');return;}
  if(venue==='Other'&&!venueOther){showToast('⚠️ กรุณาระบุสถานที่');return;}
  sessions.push({
    id:nextId++, date,
    time:document.getElementById('fTime').value,
    duration:parseInt(document.getElementById('fDuration').value)||60,
    title,
    level:document.getElementById('fLevel').value,
    students:parseInt(document.getElementById('fStudents').value)||1,
    coach:document.getElementById('fCoach').value,
    venue, venueOther,
    court:parseInt(document.getElementById('fCourt').value)||1,
  });
  if(venue==='Other'&&venueOther) saveCustomVenue(venueOther);
  saveSessions();
  document.getElementById('fTitle').value='';
  document.getElementById('fVenueOther').value='';
  showToast('✅ เพิ่มคลาสแล้ว');
  render();
}

function delSession(id){
  if(!confirm('ลบคลาสนี้?'))return;
  sessions=sessions.filter(s=>s.id!==id); saveSessions(); showToast('🗑️ ลบแล้ว'); render();
}

function openEdit(id){
  const s=sessions.find(x=>x.id===id); if(!s)return; editingId=id;
  document.getElementById('mTitle').value=s.title;
  document.getElementById('mDate').value=s.date;
  document.getElementById('mTime').value=s.time;
  document.getElementById('mDuration').value=s.duration||60;
  document.getElementById('mStudents').value=s.students;
  document.getElementById('mLevel').value=s.level;
  document.getElementById('mCoach').value=s.coach;
  buildVenueSelect('mVenue',s.venue||'Beat Discovery');
  document.getElementById('mVenueOther').value=s.venueOther||'';
  document.getElementById('mVenueOtherWrap').style.display=s.venue==='Other'?'block':'none';
  document.getElementById('mCourt').value=s.court||1;
  updateEndTime('m');
  document.getElementById('editModal').classList.add('show');
}

function saveEdit(){
  const s=sessions.find(x=>x.id===editingId); if(!s)return;
  const venue=document.getElementById('mVenue').value;
  const venueOther=venue==='Other'?document.getElementById('mVenueOther').value.trim():'';
  s.title=document.getElementById('mTitle').value.trim()||s.title;
  s.date=document.getElementById('mDate').value||s.date;
  s.time=document.getElementById('mTime').value;
  s.duration=parseInt(document.getElementById('mDuration').value)||60;
  s.students=parseInt(document.getElementById('mStudents').value)||1;
  s.level=document.getElementById('mLevel').value;
  s.coach=document.getElementById('mCoach').value;
  s.venue=venue; s.venueOther=venueOther;
  if(venue==='Other'&&venueOther) saveCustomVenue(venueOther);
  s.court=parseInt(document.getElementById('mCourt').value)||1;
  saveSessions(); closeModal('editModal'); showToast('✅ บันทึกแล้ว'); render();
}

function closeModal(id){
  document.getElementById(id).classList.remove('show');
  editingId=null;
  if(id==='dupModal'){duplicatingId=null;duplicateDates=[];}
}

function clearAllData(){
  if(!confirm('ล้างข้อมูลทั้งหมด?\nไม่สามารถกู้คืนได้'))return;
  sessions=[];
  nextId=1;
  saveSessions(); showToast('🗑️ ล้างข้อมูลแล้ว'); render();
}

/* ── Google Sheets ── */
function getGToken(){
  if(gToken&&Date.now()<gTokenExpiry-60000) return Promise.resolve(gToken);
  return Promise.reject(new Error('No auth token'));
}

/* Columns: id | date | time | duration | title | level | students | coach | venue | court */
const GS_RANGE='Sheet1!A1:K';
const GS_HEADERS=['id','date','time','finishTime','duration(hrs)','title','level','students','coach','venue','court'];

function sessionToRow(s){
  return [
    String(s.id), s.date, s.time,
    calcEndTime(s.time,s.duration||60),
    String(Math.round((s.duration||60)/60)),
    s.title, s.level, String(s.students),
    s.coach, getVenueName(s), String(s.court||1),
  ];
}

async function doSyncToSheets(token){
  const rows=[GS_HEADERS,...sessions.map(sessionToRow)];
  await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(GS_RANGE)}:clear`,
    {method:'POST',headers:{Authorization:`Bearer ${token}`}});
  const res=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(GS_RANGE)}?valueInputOption=RAW`,
    {method:'PUT',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},
     body:JSON.stringify({values:rows})});
  if(!res.ok)throw new Error(`Sheets API error ${res.status}`);
}

async function doPullFromSheets(token){
  const res=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(GS_RANGE)}`,
    {headers:{Authorization:`Bearer ${token}`}});
  if(!res.ok)throw new Error(`Sheets API error ${res.status}`);
  const data=await res.json();
  if(!data.values||data.values.length<2)return false;
  const[header,...rows]=data.values;
  sessions=rows.map(row=>{
    const o={}; header.forEach((k,i)=>o[k]=row[i]||'');
    const venueName=o.venue||'';
    const venue=KNOWN_VENUES.includes(venueName)?venueName:'Other';
    const venueOther=venue==='Other'?venueName:'';
    return{
      id:parseInt(o.id)||0,
      date:o.date||toDateStr(new Date()),
      time:o.time||'09:00',
      duration:Math.round(parseFloat(o['duration(hrs)']||o.duration||1))*60,
      title:o.title||'',
      level:o.level||'beginner',
      students:parseInt(o.students)||1,
      coach:o.coach||'',
      venue, venueOther,
      court:parseInt(o.court)||1,
    };
  });
  nextId=Math.max(...sessions.map(s=>s.id),0)+1;
  localStorage.setItem(KEY_S,JSON.stringify(sessions));
  return true;
}

async function autoSync(){
  if(!gToken||Date.now()>=gTokenExpiry-60000)return;
  try{
    await doSyncToSheets(gToken);
    if(await doPullFromSheets(gToken))render();
  }catch(e){}
}

async function syncToSheets(){
  try{
    showToast('⏳ กำลัง sync...');
    const token=await getGToken();
    await doSyncToSheets(token);
    if(await doPullFromSheets(token))render();
    showToast('✅ Sync ไป Sheets แล้ว');
  }catch(e){showToast('❌ '+e.message);}
}

async function pullFromSheets(){
  try{
    showToast('⏳ กำลัง sync...');
    const token=await getGToken();
    await doSyncToSheets(token);
    if(await doPullFromSheets(token))render();
    showToast('✅ Sync เสร็จแล้ว');
  }catch(e){showToast('❌ '+e.message);}
}

/* ── Init ── */
['editModal','dupModal'].forEach(id=>{
  document.getElementById(id).addEventListener('click',function(e){if(e.target===this)closeModal(id);});
});
document.getElementById('pwInput').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
